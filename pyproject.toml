[build-system]
requires      = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name            = "rustai"
version         = "0.1.0"
description     = "Zero-cost local research pipeline: async search routing, TLS-fingerprint-aware fetching, DOM denoising and BM25 context slimming for local LLMs."
readme          = "README.md"
requires-python = ">=3.9"
license         = "MIT OR Apache-2.0"
license-files   = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords        = ["rag", "scraping", "crawler", "llm", "bm25", "markdown", "search"]
authors         = [{ name = "rustai contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage      = "https://github.com/imhyensuk/rustai"
Repository    = "https://github.com/imhyensuk/rustai"
Issues        = "https://github.com/imhyensuk/rustai/issues"
Changelog     = "https://github.com/imhyensuk/rustai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "maturin>=1.7,<2.0"]

[tool.maturin]
module-name      = "rustai._rustai"
python-source    = "python"
features         = ["python", "pyo3/extension-module"]
strip            = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers   = ["network: hits the live internet; deselect with -m 'not network'"]
addopts   = "-q"
