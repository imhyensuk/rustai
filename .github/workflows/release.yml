name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wheels:
    name: wheel (${{ matrix.platform.os }}, ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest,    target: x86_64,  manylinux: 2_28 }
          # Built on a native arm64 runner rather than cross-compiled from
          # x86_64. Cross-compiling this crate means cross-compiling BoringSSL,
          # whose build wants a full aarch64 toolchain and whose bindgen step
          # wants an aarch64 sysroot to find the system headers in -- the same
          # wall a local zig attempt hit. GitHub's arm64 runners are free on
          # public repositories, so the honest fix is to stop cross-compiling:
          # the identical before-script that succeeds on x86_64 then runs
          # natively here.
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: 2_28 }
          - { os: macos-latest,     target: aarch64, manylinux: auto }
          # Not macos-13: that image was retired in December 2025, and a job
          # asking for it is not rejected -- it queues for a runner that will
          # never be assigned, so the release hangs rather than fails.
          # macos-15-intel is the replacement label for x86_64 macOS.
          - { os: macos-15-intel,   target: x86_64,  manylinux: auto }
          - { os: windows-latest,   target: x64,     manylinux: auto }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: "true"
          manylinux: ${{ matrix.platform.manylinux }}
          # Install a toolchain rather than inheriting the runner's. Without
          # this the build uses whatever rustc the image happens to ship, and
          # a macOS image carrying 1.97.1 fails the crate's 1.98 MSRV -- with
          # the same workflow that passed a day earlier, because the image
          # rotated underneath it. Linux never saw this: those builds run in a
          # manylinux container with its own Rust.
          rust-toolchain: stable
          # wreq builds BoringSSL. btls-sys needs cmake, perl and a C++
          # toolchain to compile it, and bindgen -- which it also build-depends
          # on -- needs libclang to read the headers. Omitting clang is the
          # failure mode that reads "Unable to find libclang", nowhere near the
          # line that caused it. Both Linux targets are pinned to manylinux
          # 2_28 because bindgen 0.72 wants libclang 9+, which the older
          # CentOS 7 image cannot supply.
          before-script-linux: |
            if command -v dnf >/dev/null; then
              dnf install -y cmake perl-core gcc-c++ clang-devel
            elif command -v yum >/dev/null; then
              yum install -y cmake perl-core gcc-c++ clang-devel
            elif command -v apt-get >/dev/null; then
              apt-get update && apt-get install -y cmake perl g++ clang libclang-dev
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  pypi:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      # Trusted publishing: no API token stored in the repository.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    name: publish to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
