name: Audit

# Kept out of ci.yml because the trigger is different: the point of an advisory
# scanner is the advisory that lands against a dependency nobody touched, which
# a push-only workflow never sees. Running the full CI matrix weekly to get that
# would cost far more than this job does.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A prebuilt binary: `cargo install cargo-audit` compiles for ~3 minutes,
      # which is longer than the scan it exists to run.
      - uses: taiki-e/install-action@cargo-audit
      # `--deny warnings` covers unmaintained and unsound crates too, not only
      # the ones with a CVE. The tree is clean against both today, so the strict
      # setting costs nothing and the first regression is visible immediately.
      - run: cargo audit --deny warnings
