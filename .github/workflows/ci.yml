name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: version is consistent across manifests
        run: python3 scripts/check_version.py
      - run: cargo fmt --all --check
      # Never `--all-features`: `nightly-simd` enables tl's portable_simd,
      # which does not build on stable. Each real combination is linted instead.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --features browser -- -D warnings
      - run: cargo clippy --all-targets --features python -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo test --doc
      # The PyO3 layer is behind a feature, so the default test build never
      # compiles it -- and clippy alone does not run its tests.
      - run: cargo test --features python
      - name: build with the headless-browser fallback
        run: cargo build --features browser

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  python:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      # Not `maturin develop`: it requires an active virtualenv, and
      # actions/setup-python provides an interpreter rather than one. Installing
      # the project the way a user does exercises the same build backend, works
      # on every runner, and additionally checks that the packaging metadata is
      # sound -- which `develop` skips.
      - name: build and install the extension
        run: pip install .
      # The `network` tests are excluded: CI must not depend on third-party
      # services being up, and they would be rate-limited anyway.
      - run: pytest
      # Editors read the stub, not __doc__, so the two have to say the same
      # thing -- and they only do if something checks.
      - run: python3 scripts/sync_stub_docs.py --check
      # The README documents the version it ships with, so it is checked
      # against this checkout rather than the last release.
      - run: python3 scripts/check_notebooks.py docs

  notebooks:
    name: notebooks run on the released rustai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deliberately the published package, not this checkout. The notebooks
      # are for Colab and Colab installs from PyPI, so calling something that
      # only exists on `main` breaks the cell for whoever trusted it -- which
      # has happened twice.
      - run: pip install rustai
      - name: notebook examples run on the released package
        run: python3 scripts/check_notebooks.py notebooks
